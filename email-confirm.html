<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email confirmed — UG Cable Survey Pro</title>
  <style>
    :root {
      --paper: #fff8e7;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #1f2933;
      --action: #f5c400;
      --success: #14532d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Nirmala UI", "Noto Sans Bengali", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--ink);
      color: var(--paper);
      padding: 28px 24px 22px;
    }

    header .stripe {
      height: 6px;
      background: var(--action);
      margin: -28px -24px 22px;
    }

    .brand {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-bn {
      margin: 4px 0 0;
      color: var(--action);
      font-size: 14px;
      font-weight: 700;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 40px;
    }

    .card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 16px;
      padding: 28px 24px 24px;
    }

    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--action);
      display: grid;
      place-items: center;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }

    .title-bn {
      margin: 8px 0 0;
      text-align: center;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 800;
    }

    .status {
      margin: 18px 0 0;
      text-align: center;
      color: var(--success);
      font-size: 15px;
      font-weight: 800;
    }

    .next {
      margin: 22px 0 0;
      padding-top: 16px;
      border-top: 2px solid var(--ink);
      font-size: 17px;
      line-height: 1.45;
      font-weight: 700;
    }

    .next-bn {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <div class="stripe"></div>
    <p class="brand">UG Cable Survey Pro</p>
    <p class="brand-bn">আন্ডারগ্রাউন্ড কেবল সার্ভে</p>
  </header>
  <main>
    <article class="card">
      <div class="mark" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
          <path d="M4 8h4.2c.8 0 1.5.4 1.9 1.1L12 12.5l1.9-3.4c.4-.7 1.1-1.1 1.9-1.1H20" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16h4.2c.8 0 1.5-.4 1.9-1.1L12 11.5l1.9 3.4c.4.7 1.1 1.1 1.9 1.1H20" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="4" cy="8" r="1.4" fill="#111"/>
          <circle cx="4" cy="16" r="1.4" fill="#111"/>
          <circle cx="20" cy="8" r="1.4" fill="#111"/>
          <circle cx="20" cy="16" r="1.4" fill="#111"/>
        </svg>
      </div>
      <h1>Email confirmed</h1>
      <p class="title-bn">ইমেইল নিশ্চিত হয়েছে</p>
      <p class="status">This address is verified.</p>
      <p class="next">Close this page. Open the app and sign in.</p>
      <p class="next-bn">এই পাতা বন্ধ করুন। অ্যাপ খুলে সাইন ইন করুন।</p>
    </article>
  </main>
</body>
</html>
